<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Figure Feed</title>
<meta name="description" content="New research from the major journals, one figure-led card at a time.">
<meta name="theme-color" content="#2b130b">
<script>try { var l = localStorage.getItem("ff:look"); if (l) document.documentElement.dataset.look = JSON.parse(l); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><svg class="mark" viewBox="2 6 60 52" aria-hidden="true">
      <rect x="4" y="8" width="56" height="48" rx="8" fill="none" stroke="var(--logo-a)" stroke-width="3"/>
      <g fill="none" stroke="var(--logo-b)" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 22 C10 22 10 18 16 18 L40 18 C46 18 48 14 54 12 C57 11 60 10.5 60 10.5"/>
        <path d="M4 42 C10 42 10 46 16 46 L40 46 C46 46 48 50 54 52 C57 53 60 53.5 60 53.5"/>
      </g>
      <circle cx="32" cy="32" r="4.5" fill="var(--logo-a)"/>
      <g fill="var(--logo-b)"><circle cx="32" cy="24" r="3.4"/><circle cx="39" cy="28" r="3.4"/><circle cx="39" cy="36" r="3.4"/>
        <circle cx="32" cy="40" r="3.4"/><circle cx="25" cy="36" r="3.4"/><circle cx="25" cy="28" r="3.4"/></g>
    </svg>Figure Feed</h1>
    <span class="stamp" id="stamp"></span>
    <button class="look" id="look" aria-label="Change colour look">Technical</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="week" aria-selected="true">This week</button>
    <button role="tab" data-tab="figs">New figures</button>
    <button role="tab" data-tab="saved">Saved</button>
    <button role="tab" data-tab="earlier">Earlier</button>
  </nav>
  <div class="filters">
    <div class="chips" id="chips"></div>
    <label class="toggle"><input type="checkbox" id="figsOnly"> Figures only</label>
  </div>
</header>

<main class="sc" id="main">
  <p class="empty" id="loading">Loading…</p>
</main>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo">Undo</button></div>

<footer class="foot">
  Papers from the journals' own feeds; summaries from PubMed abstracts. Full figures are
  shown only for papers published under a Creative Commons licence and link to their source.
</footer>

<script src="app.js"></script>
</body>
</html>
