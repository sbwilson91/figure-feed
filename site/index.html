<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Figure Feed</title>
<meta name="description" content="New research from the major journals, one figure-led card at a time.">
<!-- Only this site's own code runs; figures load from any https host. The hash is the
     inline look script below: change that script and the hash must change with it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-GzsJHBwAf031rO0NhtirWdX3VDfTrnWhnl/1Rw9sgzc='; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#2b130b">
<script>try { var l = localStorage.getItem("ff:look"); if (l) document.documentElement.dataset.look = JSON.parse(l); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/ff.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/ff-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><svg class="mark" viewBox="2 6 60 52" aria-hidden="true">
      <rect x="4" y="8" width="56" height="48" rx="8" fill="none" stroke="var(--logo-b)" stroke-width="3"/>
      <g fill="none" stroke="var(--logo-a)" stroke-width="2.4" stroke-linecap="round">
        <path d="M4 18 C9 18 10 15 15 15 L42 15 C47 15 49 13 54 12.5 C57 12.2 60 12 60 12"/>
        <path d="M4 46 C9 46 10 49 15 49 L42 49 C47 49 49 51 54 51.5 C57 51.8 60 52 60 52"/>
      </g>
      <g fill="var(--top-ink)">
        <rect x="18" y="23" width="4.4" height="18" rx="0.8"/><rect x="18" y="23" width="12" height="4" rx="0.8"/><rect x="18" y="30.5" width="9.5" height="3.8" rx="0.8"/>
        <rect x="34" y="23" width="4.4" height="18" rx="0.8"/><rect x="34" y="23" width="12" height="4" rx="0.8"/><rect x="34" y="30.5" width="9.5" height="3.8" rx="0.8"/>
      </g>
    </svg>Figure Feed</h1>
    <span class="stamp" id="stamp"></span>
    <button class="look" id="look" aria-label="Change colour look">Technical</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="week" aria-selected="true">This week</button>
    <button role="tab" data-tab="figs">New figures</button>
    <button role="tab" data-tab="saved">Saved</button>
    <button role="tab" data-tab="earlier">Earlier</button>
  </nav>
  <div class="filters">
    <div class="chips" id="chips"></div>
    <label class="toggle"><input type="checkbox" id="figsOnly"> Figures only</label>
  </div>
</header>

<main class="sc" id="main">
  <p class="empty" id="loading">Loading…</p>
</main>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo">Undo</button></div>

<footer class="foot">
  Papers from the journals' own feeds; summaries from PubMed abstracts. Full figures are
  shown only for papers published under a Creative Commons licence and link to their source.
</footer>

<script src="app.js"></script>
</body>
</html>
